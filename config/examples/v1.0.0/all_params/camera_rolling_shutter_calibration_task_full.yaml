# 有固定默认值的字段填写程序默认值；无固定默认值的字段填写合法示例并注明可选范围。
schema_version: "1.0.0" # 必填，无默认值；唯一合法值为字符串"1.0.0"。
kind: calibration_task # 默认calibration_task；本例显式写出文档种类。
job: camera_rolling_shutter_calibration # 必填，无默认值；可选四种公开job，本文件选择该RS相机job。

dataset: # 相对路径以当前 task YAML 所在目录为基准。
  type: directory # 必填，无默认值；directory通过dataset.yaml映射ID，也可填bag。
  path: ../data/stereo_YYMMDD_hhmm # 必填，无默认值；可选任意有效数据文件/目录路径。
#   time_range_s: [0.0, 30.0] # 可选秒区间；先裁剪，再按 frequency_hz 选帧。
#   frequency_hz: 5.0 # 可选Hz；改变进入检测和求解的帧，省略时不降采样。

target:
  path: aprilgrid.yaml # 必填，无默认值；可选任意有效标定板YAML路径。

cameras: # 列表顺序定义 cam0、cam1…及相邻外参方向。
  - id: cam0 # 目录输入必填且无默认值；可选任意唯一安全ID，本例取cam0。
    model: pinhole-equi # 必填，无默认值；可选pinhole-equi/pinhole-radtan，本例取前者。
  - id: cam1 # 目录输入必填且无默认值；可选任意唯一安全ID，本例取cam1。
    model: pinhole-equi # 必填，无默认值；可选pinhole-equi/pinhole-radtan，本例取前者。

# initialization: # 与普通相机任务共用 camera_calibration_initialization。
#   path: ../initialization_stereo.yaml # 可包含每目K/D及相邻T_cn_cnm1。

rolling_shutter: # 键必须与 cameras[].id 完全一致。
  cam0:
    line_delay_s: 0.0 # 默认0.0 s/行；首行时间为相机时间戳，正值表示y增大时更晚。
    estimate: true # 默认true；使用有界tanh状态联合估计，false固定给定值。
    max_abs_line_delay_s: 0.00002 # 无默认值；可选任意>abs(seed)的有限正数s/行，本例20μs/行。
  cam1:
    line_delay_s: 0.0 # 默认0.0 s/行；支持正负初值。
    estimate: true # 默认true；每目独立控制是否优化。
    max_abs_line_delay_s: 0.00002 # 无默认值；可选任意>abs(seed)的有限正数s/行，本例20μs/行。

calibration:
  freeze_intrinsics: false # 默认false；true要求至少双目且初始化含每目完整K/D。
  window_half_size_px: 2 # 默认2 px；整数>=1。
  max_displacement_px: 1.224744871391589 # 默认sqrt(1.5) px；有限且>0。
  focal_initialization_min_visible_corner_ratio: 1.0 # 默认1.0；(0,1]，保留完整板初始化。
  synchronization_tolerance_s: 0.02 # 默认0.02 s；>=0，仅建多目共视关系。
  min_views_for_outlier_statistics: 20 # 默认20；不足时不做最终统计过滤。
  remove_outliers: true # 默认true；与final_filtering同时为true才执行RS最终过滤。
  final_filtering: true # 默认true；按max(4σ,feature_sigma_px)过滤并重解。
  blake_zisserman: false # 默认false；true启用Blake-Zisserman鲁棒核。
  max_iterations: 80 # 正整数；每次RS联合Optimizer2的最大迭代数，默认80。
  spline_order: 4 # 无量纲整数，>=3；连续目标位姿样条阶数，二阶运动先验要求至少3阶，默认4。
  time_padding_s: 0.5 # 秒，有限正数且须严格大于各目(H-1)*行时间范围；样条两端支持，默认0.5。
  knots_per_second: 1.0 # 无固定数值默认；可选任意有限正数Hz，本例取1.0；省略时自动取观测中位频率。
  feature_sigma_px: 1.0 # px，有限正数；重投影协方差标准差，默认1。
  motion_translation_weight: 0.00001 # 二阶平移运动先验信息权重，有限正数，默认1e-5。
  motion_rotation_weight: 0.01 # 二阶旋转运动先验信息权重，有限正数，默认1e-2。

execution:
  parallelism: 4 # 无固定数值默认；可选任意正整数，本例取4；组件专用字段优先。
  detector_processes: 4 # 无固定数值默认；可选任意正整数，本例取4。
  optimizer_threads: 4 # 无固定数值默认；可选任意正整数，本例取4。
  detector_inflight_per_worker: 2 # 默认2；每个检测worker的在途帧上限。
  detector_opencv_threads: 1 # 默认1；每个检测worker内OpenCV线程数。
  profiling_memory_sample_interval_s: 0.25 # 默认0.25 s；仅profile构建且显式请求计时时采样。

output:
  name: null # 默认null；派生名称；显式值须为1~160位安全文件名stem。
  save_diagnostics: false # 默认false；按需保存日志、validation、observability和manifest。
  save_metrics: false # 默认false；按需另存metrics.json。
  export_text: false # 默认false；按需另存结果文本。
  archive_observations: false # 默认false；true保存最终逐角点预测、残差和角点时刻。
  archive_selection_history: false # 默认false；true时还要求archive_observations=true。
  copy_used_images: false # 默认false；不复制原图。
  export_opencv: false # 默认false；只导出静态K/D/T，不包含逐行运动补偿。
  export_poses: false # 默认false；可选保存首行时间参考的目标位姿CSV。
  verbose: false # 默认false；开启后增加终端阶段、参数与耗时信息，不启用原生交互绘图。
  show_extraction: false # 默认false；不打开检测窗口。
  extraction_stepping: false # 默认false；RS相机后端当前不使用逐帧交互检测。
  interactive_report: false # 默认false；生成HTML/PDF但不弹窗。
  evaluation_pairing_tolerance_s: 0.0002 # 默认0.0002 s；>=0，只用于输出评价配对。
  visualizations:
    enabled: false # 默认false；开启后生成检测/残差及普通光学校正图。
    max_frames_per_camera: 30 # 默认30；每目展示上限，不改变统计总体。
    max_pairs: 30 # 默认30；双目展示上限。
    sampling: uniform # 默认且当前唯一支持uniform；确定性均匀抽样。
    undistortion:
      enabled: true # 默认true；父级enabled=true时生成每目独立普通光学去畸变图，不补偿逐行运动。
      crop: false # 默认false；布尔值；false保留最大视场且可能有黑边，true缩放裁去无效边，输出像素尺寸不变。
  rectification:
    balance: 0.0 # 默认0.0；[0,1]，fisheye普通光学校正视场平衡。
    fov_scale: 1.0 # 默认1.0；>0，OpenCV fisheye校正视场倍率。
    size: null # 默认null，沿用源尺寸；也可填写[宽,高]正整数像素。
  assessment:
    reference_grading: true # 默认true；参考等级不是产线判定。
    rules: [] # 默认空列表；表示未配置业务验收阈值。
