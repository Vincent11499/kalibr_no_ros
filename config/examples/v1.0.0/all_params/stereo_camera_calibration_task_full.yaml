schema_version: "1.0.0" # 软件、配置和结果统一字符串版本。
kind: calibration_task # 本文件是标定任务，不是结果或初始化文件。
job: camera_calibration # 相机任务与相机–IMU任务分别运行。

dataset: # 所有相对路径均以当前 task YAML 所在目录为基准。
  type: directory # 直接读取采集目录；bag 需显式改为 bag。
  path: ../data/stereo_imu_YYMMDD_hhmm # 替换为本次新格式数据目录，不能指向历史整数schema目录。
#   time_range_s: [0.0, 60.0] # 可选裁剪秒数，[起点,终点]且终点>起点；默认不裁剪，IMU需保留前后覆盖。
#   frequency_hz: 5.0 # 可选相机读取降采样Hz，>0；默认不额外降采样，更改会影响数据选择与可比性。
target: # AprilGrid 参数独立维护，复用同一块实体板。
  path: aprilgrid.yaml # 已知板：8×8、边长65mm、间距比例0.3、起始ID80。

cameras: # 列表顺序固定相机身份；cam0左目、cam1右目。
  - id: cam0 # 按 dataset.yaml 的传感器 ID 选择左目；bag 输入还须填写 topic。
    model: pinhole-equi # 内参[fu,fv,cu,cv]，畸变[k1,k2,k3,k4]。
  - id: cam1 # 右目；相邻外参将表示从cam0到cam1。
    model: pinhole-equi # 原生equidistant四参数模型。

# initialization: # 默认不启用；必须先用真实可信物理参数替换模板占位值。
#   path: ../initialization_stereo.yaml # 独立相机seed，不是结果文件。
#   strategy: refine # 默认refine保留原生refinement；direct需满足完整性要求。

calibration: # 仅求解和观测选择参数；保存与显示选项放output。
  freeze_intrinsics: false # 默认false；true只适用于至少双目且每台提供完整seed。
  window_half_size_px: 2 # 像素，正整数；实际亚像素窗口为5×5，原生默认。
  max_displacement_px: 1.224744871391589 # 像素，>0；内部平方为原生1.5阈值。
  focal_initialization_min_visible_corner_ratio: 1.0 # 无seed时的完整帧比例，(0,1]；1保留原生路径。
  synchronization_tolerance_s: 0.0002 # 秒，>=0；对齐采集200µs。改变配对，原生省略值为0.02s。
  qr_tolerance: 0.02 # 无量纲有限数；保留原生CLI参数，当前不作用于线性求解器。
  information_gain_tolerance: 0.2 # 信息增益阈值；>=0或-1，改变增量view选择。
  min_views_for_outlier_statistics: 20 # view数量，正整数；开始建立异常点统计的门槛。
  shuffle: false # 固定观测顺序，保证候选与基线可比较。
  remove_outliers: true # 原生异常角点过滤；更改会改变求解数据。
  final_filtering: true # 保留原生最终过滤阶段。
  blake_zisserman: false # 原生默认；true改变残差的鲁棒代价。

execution: # 固定可重复线程预算，不改动数据选择或算法超参数。
  detector_processes: 4 # 检测工作进程数，正整数；参考和候选比较时保持一致。
  optimizer_threads: 4 # 已接入的原生优化阶段线程数，正整数。
  detector_inflight_per_worker: 2 # 每worker允许在途帧数，正整数。
  detector_opencv_threads: 1 # 每个检测worker的OpenCV线程数，防止超配。
  profiling_memory_sample_interval_s: 0.25 # 秒，>0；仅profile构建且显式启用时采样。

output: # 后处理与证据保存，不反馈修改求解问题或最终观测。
  archive_observations: true # 保存最终实际使用帧、view、角点与残差，供离线重新评价。
  archive_selection_history: true # 保存可用的选择/过滤事件；依赖archive_observations=true。
  copy_used_images: false # 不复制原图；重新可视化时需要可访问的源数据。
  export_opencv: true # 导出pinhole-equi对应fisheye参数及双目校正矩阵。
  export_poses: false # 可选poses.csv；启用后增加序列化。
  verbose: false # 关闭原生详细打印。
  show_extraction: false # 默认不显示检测窗口，启用会影响运行方式与耗时。
  extraction_stepping: false # 默认不逐帧交互检测。
  interactive_report: false # 生成报告但不弹出交互图窗。
  evaluation_pairing_tolerance_s: 0.0002 # 秒，>=0；仅Camera–IMU最终观测后处理配对，不改变原生求解。
  visualizations: # 从最终使用帧按稳定时间顺序均匀抽样。
    enabled: true # 输出角点/残差覆盖图及双目校正示意。
    max_frames_per_camera: 30 # 每相机最大可视化帧数，正整数；不影响统计总体。
    max_pairs: 30 # 最大双目可视化对数，正整数；统计仍用全部最终共同角点。
    sampling: uniform # 当前唯一支持的确定性均匀抽样方法。
  rectification: # 仅评价与OpenCV导出；改变会影响像素极线误差，不影响标定结果。
    balance: 0.0 # 无量纲，[0,1]；fisheye校正视场平衡参数。
    fov_scale: 1.0 # 无量纲，>0；OpenCV fisheye校正视场倍率。
    size: null # null沿用源尺寸；也可显式[正整数宽,正整数高]，单位像素。
  assessment: # 参考评级和业务验收分别保存。
    reference_grading: true # 开启参考显示等级；它不是经验证的产线验收结论。
    rules: [] # 未配置业务阈值，status为not_evaluated，不能自动宣称合格。
