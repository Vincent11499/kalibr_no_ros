# 有固定默认值的字段填写程序默认值；无固定默认值的字段填写合法示例并注明可选范围。
schema_version: "1.0.0" # 必填，无默认值；唯一合法值为字符串"1.0.0"。
kind: calibration_task # 默认calibration_task；本例显式写出文档种类。
job: camera_calibration # 必填，无默认值；可选五种公开job，本文件选camera_calibration。

dataset: # 所有相对路径均以当前 task YAML 所在目录为基准。
  type: directory # 必填，无默认值；directory直接读取采集目录，也可填bag。
  path: ../data/stereo_imu_YYMMDD_hhmm # 必填，无默认值；可选任意有效数据文件/目录路径。
#   time_range_s: [0.0, 60.0] # 可选裁剪秒数，[起点,终点]且终点>起点；默认不裁剪，IMU需保留前后覆盖。
#   frequency_hz: 5.0 # 可选相机读取降采样Hz，>0；默认不额外降采样，更改会影响数据选择与可比性。
target: # AprilGrid 参数独立维护，复用同一块实体板。
  path: aprilgrid.yaml # 必填，无默认值；可选任意有效标定板YAML路径。

cameras: # 列表顺序固定相机身份；cam0左目、cam1右目。
  # 普通相机model的十个精确可选名称见上级README_ZH.md。
  - id: cam0 # 目录输入必填且无默认值；可选任意唯一安全ID，本例取cam0。
    model: pinhole-equi # 必填，无默认值；可选值见上一行，本例取pinhole-equi。
  - id: cam1 # 目录输入必填且无默认值；可选任意唯一安全ID，本例取cam1。
    model: pinhole-equi # 必填，无默认值；可选值见上一行，本例取pinhole-equi。

# initialization: # 默认不启用；必须先用真实可信物理参数替换模板占位值。
#   path: ../initialization_stereo.yaml # 独立相机seed，不是结果文件。

calibration: # 仅求解和观测选择参数；保存与显示选项放output。
  solver_mode: incremental # 默认incremental；full_batch在S3全量联合优化后直接输出。
  freeze_intrinsics: false # 默认false；true只适用于至少双目且每台提供完整seed。
  window_half_size_px: 2 # 默认2 px；整数>=1，实际窗口5×5。
  max_displacement_px: 1.224744871391589 # 默认sqrt(1.5) px；有限且>0。
  focal_initialization_min_visible_corner_ratio: 1.0 # 默认1.0；(0,1]，保留原生完整板路径。
  synchronization_tolerance_s: 0.02 # 默认0.02 s；>=0，改变多相机配对。
  qr_tolerance: 0.02 # 默认0.02；无量纲有限数，当前解析后不作用于线性求解器。
  information_gain_tolerance: 0.2 # 默认0.2；>=0或特殊值-1，改变增量view选择。
  min_views_for_outlier_statistics: 20 # 默认20；正整数，开始建立异常点统计的view门槛。
  shuffle: true # 默认true；false按输入时间顺序加入增量估计器。
  remove_outliers: true # 默认true；原生异常角点过滤，更改会改变求解数据。
  final_filtering: true # 默认true；保留原生最终过滤阶段。
  blake_zisserman: false # 默认false；true改变残差的鲁棒代价。

execution: # 固定可重复线程预算，不改动数据选择或算法超参数。
  parallelism: 4 # 无固定数值默认；可选任意正整数，本例取4；组件专用字段优先。
  detector_processes: 4 # 无固定数值默认；可选任意正整数，本例取4。
  optimizer_threads: 4 # 无固定数值默认；可选任意正整数，本例取4。
  detector_inflight_per_worker: 2 # 默认2；正整数，每worker允许的在途帧数。
  detector_opencv_threads: 1 # 默认1；正整数，每个检测worker的OpenCV线程数。
  profiling_memory_sample_interval_s: 0.25 # 默认0.25 s；仅profile构建且显式请求计时时采样。

output: # 后处理与证据保存，不反馈修改求解问题或最终观测。
  name: null # 默认null；派生名称；显式值须为1~160位安全文件名stem。
  save_diagnostics: false # 默认false；按需保存日志、输入校验、可观性、判定、运行清单及任务/初始化诊断。
  save_metrics: false # 默认false；按需另存metrics.json，供没有观测归档时离线读取汇总指标。
  export_text: false # 默认false；按需另存人可读results.txt，结果YAML与HTML/PDF仍正常生成。
  archive_observations: false # 默认false；true归档最终帧、view、角点与残差。
  archive_selection_history: false # 默认false；true时还要求archive_observations=true。
  copy_used_images: false # 默认false；重新可视化时需要可访问的源数据。
  export_opencv: false # 默认false；按需另存OpenCV相机参数及可用双目校正矩阵。
  export_poses: false # 默认false；可选poses.csv，启用后增加序列化。
  verbose: false # 默认false；开启后增加终端阶段、参数与耗时信息，不启用原生交互绘图。
  show_extraction: false # 默认false；不显示检测窗口，启用会影响运行方式与耗时。
  extraction_stepping: false # 默认false；相机任务不使用逐帧交互检测。
  interactive_report: false # 默认false；生成报告但不弹出交互图窗。
  evaluation_pairing_tolerance_s: 0.0002 # 默认0.0002 s；>=0，仅后处理配对。
  visualizations: # 从最终使用帧按稳定时间顺序均匀抽样。
    enabled: false # 默认false；true生成角点/残差覆盖图及可用双目校正示意。
    max_frames_per_camera: 20 # 默认20；每相机最大可视化帧数，不影响统计总体。
    max_pairs: 20 # 默认20；最大双目可视化对数，统计仍用全部最终共同角点。
    sampling: uniform # 默认且当前唯一支持uniform；确定性均匀抽样。
    undistortion:
      enabled: true # 默认true；父级enabled=true时生成每目独立去畸变图，不改变标定或指标。
      crop: false # 默认false；布尔值；false保留最大视场且可能有黑边，true缩放裁去无效边，输出像素尺寸不变。
  rectification: # 双目评价、对齐图及OpenCV双目标定导出共用；不影响求解结果。
    balance: 0.0 # 默认0.0；无量纲，[0,1]；fisheye校正视场平衡参数。
    fov_scale: 1.0 # 默认1.0；无量纲，>0；OpenCV fisheye校正视场倍率。
    size: null # 默认null，沿用源尺寸；也可显式[正整数宽,正整数高]。
  assessment: # 参考评级和业务验收分别保存。
    reference_grading: true # 默认true；开启参考显示等级，不是产线验收结论。
    rules: [] # 默认空列表；status为not_evaluated，不能自动宣称合格。
