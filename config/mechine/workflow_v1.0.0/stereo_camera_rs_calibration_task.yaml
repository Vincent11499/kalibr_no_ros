schema_version: "1.0.0"
kind: calibration_task
job: camera_rolling_shutter_calibration
dataset:
  type: directory
  path: __DATASET_PATH__
target:
  path: 测试场_aprilgrid_8x8.yaml
cameras:
  - id: cam0
    model: pinhole-equi
  - id: cam1
    model: pinhole-equi
initialization:
  path: initialization_stereo_camera.yaml
rolling_shutter:
  cam0:
    line_delay_s: 0.000008
    estimate: true
    max_abs_line_delay_s: 0.00002
  cam1:
    line_delay_s: 0.000008
    estimate: true
    max_abs_line_delay_s: 0.00002
calibration:
  freeze_intrinsics: false
  window_half_size_px: 7
  max_displacement_px: 2.0
  focal_initialization_min_visible_corner_ratio: 0.75
  synchronization_tolerance_s: 0.0001
  min_views_for_outlier_statistics: 20
execution:
  detector_processes: 8
  optimizer_threads: 8
  detector_inflight_per_worker: 2
  detector_opencv_threads: 1
output:
  name: __OUTPUT_NAME__
  save_diagnostics: true
  save_metrics: true
  visualizations:
    enabled: true
    sampling: uniform
    max_frames_per_camera: 20
    max_pairs: 20
    undistortion:
      enabled: true
      crop: false
