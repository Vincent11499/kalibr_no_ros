schema_version: "1.0.0"
kind: calibration_task
job: camera_calibration
dataset:
  type: directory
  path: __DATASET_PATH__
target:
  path: 测试场_aprilgrid_8x8.yaml
initialization:
  path: initialization_mono_camera.yaml
cameras:
  - id: cam0
    model: pinhole-equi
calibration:
  window_half_size_px: 7
  max_displacement_px: 2.0
  synchronization_tolerance_s: 0.0001
  shuffle: true
execution:
  detector_processes: 8
  optimizer_threads: 8
  detector_inflight_per_worker: 2
  detector_opencv_threads: 1
output:
  name: __OUTPUT_NAME__
  save_diagnostics: true
  save_metrics: true
  visualizations:
    enabled: true
    sampling: uniform
    max_frames_per_camera: 20
    max_pairs: 20
    undistortion:
      enabled: true
      crop: false
