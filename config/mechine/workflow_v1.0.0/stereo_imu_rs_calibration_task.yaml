schema_version: "1.0.0"
kind: calibration_task
job: camera_imu_rolling_shutter_calibration
dataset:
  type: directory
  path: __DATASET_PATH__
target:
  path: 测试场_aprilgrid_8x8.yaml
camera_calibration:
  path: __CAMERA_CALIBRATION_PATH__
imus:
  - id: imu0
    path: imu_noise.yaml
    model: calibrated
rolling_shutter:
  cam0:
    line_delay_s: 0.000008
    estimate: true
    max_abs_line_delay_s: 0.00002
  cam1:
    line_delay_s: 0.000008
    estimate: true
    max_abs_line_delay_s: 0.00002
calibration:
  window_half_size_px: 7
  max_displacement_px: 2.0
  max_iterations: 30
  time_offset_padding_s: 0.03
  reprojection_sigma_px: 1.0
  recompute_camera_chain_extrinsics: false
execution:
  detector_processes: 8
  optimizer_threads: 8
  detector_inflight_per_worker: 2
  detector_opencv_threads: 1
output:
  name: __OUTPUT_NAME__
  save_diagnostics: true
  save_metrics: true
  visualizations:
    enabled: true
    max_frames_per_camera: 20
    max_pairs: 20
    sampling: uniform
