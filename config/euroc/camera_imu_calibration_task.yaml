schema_version: 1.0.0
kind: calibration_task
job: camera_imu_calibration
dataset:
  type: bag
  path: /mnt/q/File/machine_data/evt3.1-data/euroc_cam/camara_imu.bag
  time_range_s:
  - 0.02
  - 72.0
target:
  path: aprilgrid.yaml
execution:
  detector_processes: 4
  optimizer_threads: 4
  detector_inflight_per_worker: 2
  detector_opencv_threads: 1
output:
  archive_observations: true
  archive_selection_history: true
  export_opencv: true
  visualizations:
    enabled: true
    max_frames_per_camera: 30
    max_pairs: 30
    sampling: uniform
  assessment:
    reference_grading: true
    rules: []
camera_calibration:
  path: /mnt/q/File/machine_data/evt3.1-data/output/euroc_cam/260909_2018/stereo/calibration.yaml
imus:
- id: imu0
  path: imu.yaml
  model: calibrated
