$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kalibr-noros.local/schemas/task-v2.schema.yaml
title: Kalibr no-ROS task
type: object
additionalProperties: false
required: [schema_version, job, dataset, target]
properties:
  schema_version:
    const: 2
  job:
    enum: [camera_calibration, camera_imu_calibration]
  dataset:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {type: string}
      format: {enum: [auto, ros1, ros2]}
      time_range_s:
        type: array
        minItems: 2
        maxItems: 2
        items: {type: number}
      frequency_hz: {type: number, exclusiveMinimum: 0}
  target:
    type: object
  cameras:
    type: array
    items:
      type: object
      required: [topic, model]
  camera_calibration:
    oneOf:
      - {type: string}
      - {type: object, required: [path]}
  imus:
    type: array
    items:
      type: object
      required: [path]
  calibration: {type: object}
  execution:
    type: object
    additionalProperties: false
    properties:
      parallelism: {type: integer, minimum: 1}
      detector_processes: {type: integer, minimum: 1}
      optimizer_threads: {type: integer, minimum: 1}
