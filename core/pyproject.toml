[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "kalibr-no-ros-core"
version = "0.2.0"
description = "Kalibr-compatible dataset adapters over kalibr-bag-io"
requires-python = ">=3.8"
dependencies = ["numpy", "kalibr-bag-io==0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
